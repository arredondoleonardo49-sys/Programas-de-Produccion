<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programas de producción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Índice de ingenieria.lineaitalia.net (fichas, especificaciones, folios, material y foto por ruta). Se regenera con el script del OS. -->
<script src="assets/ingenieria.js"></script>
<script src="assets/piezas-biblioteca.js"></script>
<style>
/* Formato visual de OEE Planta / Nidos Láser de Cama (tema oscuro, IBM Plex, menú lateral) */
:root{--bg:#0f1117;--bg2:#181b24;--bg3:#1e2130;--border:#2a2e3f;--text:#e8eaf0;--text2:#8b8fa8;--text3:#555870;--blue:#4a9eff;--green:#3ecf8e;--amber:#f5a623;--red:#f06060;--radius:8px;--radius-lg:12px;
  --sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --ok-bg:rgba(62,207,142,.15);--warn-bg:rgba(245,166,35,.15);--err-bg:rgba(240,96,96,.15);--info-bg:rgba(74,158,255,.15)}
html{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:13px/1.45 var(--sans);background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@keyframes scaleIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes rowIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}

/* ---------- menú lateral ---------- */
.sidebar{width:226px;min-width:226px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .25s,min-width .25s;overflow-y:auto}
.sidebar.collapsed{width:56px;min-width:56px}
.sidebar-logo{padding:1.15rem 1.25rem .9rem;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden}
.sidebar.collapsed .sidebar-logo{padding:1rem 0;justify-content:center}
.logo-box{width:34px;height:34px;flex-shrink:0;background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:5px}
.logo-box img{width:100%;height:100%;object-fit:contain}
.logo-text{font-size:14.5px;font-weight:600;letter-spacing:.3px}
.logo-sub{font-size:11px;color:var(--text2);margin-top:2px;font-family:var(--mono)}
.ctsw{margin:0 1rem .8rem;display:flex;flex-direction:column;gap:4px;padding-bottom:.8rem;border-bottom:1px solid var(--border)}
.ctsw button{justify-content:flex-start;width:100%;background:transparent;border:1px solid var(--border);color:var(--text2);padding:7px 10px}
.ctsw button.on{background:var(--info-bg);border-color:var(--blue);color:var(--text);font-weight:600}
.ctsw button b{font:600 10px var(--mono);background:var(--bg);border-radius:4px;padding:1px 5px;color:var(--text2)}
.sidebar.collapsed .ctsw{margin:0 6px .6rem}
.sidebar.collapsed .ctsw button{justify-content:center;padding:6px 0}
.sidebar.collapsed .ctsw .ctl{display:none}
.nav-section{padding:.6rem 0}
.nav-label{font-size:10px;font-weight:600;color:var(--text3);padding:0 1.25rem .5rem;letter-spacing:1px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 1.25rem;cursor:pointer;font-size:13px;color:var(--text2);border-left:2px solid transparent;transition:all .18s;white-space:nowrap;position:relative;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.on{background:var(--bg3);color:var(--text);border-left-color:var(--blue);font-weight:500}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item .n{margin-left:auto;font:500 10px var(--mono);background:var(--bg);color:var(--text2);padding:1px 7px;border-radius:9px}
.nav-item[data-t=carga] svg{color:#4a9eff;filter:drop-shadow(0 0 4px rgba(74,158,255,.5))}
.nav-item[data-t=progs] svg{color:#3ecf8e;filter:drop-shadow(0 0 4px rgba(62,207,142,.5))}
.nav-item[data-t=hora] svg{color:#f5a623;filter:drop-shadow(0 0 4px rgba(245,166,35,.5))}
.nav-item[data-t=rutas] svg{color:#c084fc;filter:drop-shadow(0 0 4px rgba(192,132,252,.5))}
.nav-item[data-t=modelos] svg{color:#fb7185;filter:drop-shadow(0 0 4px rgba(251,113,133,.5))}
.sidebar.collapsed .logo-txt,.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-item span,.sidebar.collapsed .sb-txt{display:none}
.sidebar.collapsed .nav-item{padding:10px 0;justify-content:center;border-left:none}
.sidebar-bottom{margin-top:auto;padding:1rem 1.25rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.sidebar.collapsed .sidebar-bottom{padding:.75rem 6px}
.sb-btn{width:100%;font:11px var(--sans);background:transparent;border:1px solid var(--border);color:var(--text3);border-radius:var(--radius);cursor:pointer;padding:5px 0;display:flex;align-items:center;justify-content:center;gap:6px}
.sb-btn:hover{border-color:var(--blue);color:var(--text)}
.sb-btn svg{width:14px;height:14px}

/* ---------- página ---------- */
.main{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column}
.topbar{padding:1.1rem 1.5rem .7rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--bg)}
.page-title{font-size:17px;font-weight:600}
.page-title .ctb{font:600 11px var(--mono);color:var(--blue);background:var(--info-bg);border-radius:4px;padding:2px 7px;margin-left:6px;vertical-align:3px}
.page-sub{font-size:12px;color:var(--text2);margin-top:2px}
.acciones{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.content{padding:1.25rem 1.5rem;flex:1}
.pie{padding:.9rem 1.5rem;border-top:1px solid var(--border);font:11px var(--mono);color:var(--text3);display:flex;gap:12px;flex-wrap:wrap}
.sp{flex:1}
.hide{display:none!important}

/* ---------- controles ---------- */
button,.btn{font:500 12px var(--sans);border:1px solid var(--border);background:var(--bg3);color:var(--text2);padding:7px 14px;border-radius:var(--radius);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s}
button:hover,.btn:hover{border-color:var(--blue);color:var(--text)}
button.pri{background:var(--blue);color:#fff;border-color:var(--blue);font-size:13px;padding:8px 16px}
button.pri:hover{background:#3a8ef0;box-shadow:0 4px 14px rgba(74,158,255,.4)}
button.ok{background:rgba(62,207,142,.12);border-color:rgba(62,207,142,.4);color:var(--green)}
button.peligro{background:rgba(240,96,96,.1);border-color:rgba(240,96,96,.3);color:var(--red)}
button.peligro:hover{border-color:var(--red)}
button:disabled{opacity:.45;cursor:default;box-shadow:none}
button.mini{padding:3px 9px;font-size:11px}
button.ico{padding:4px 8px;font:600 14px var(--mono);min-width:30px;justify-content:center}
input[type=text],input[type=number],input[type=date],select{font:13px var(--sans);padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg3);color:var(--text)}
input[type=number]{font-family:var(--mono)}
input:focus,select:focus{outline:none;border-color:var(--blue)}
input[type=checkbox]{accent-color:var(--blue);width:15px;height:15px;cursor:pointer;vertical-align:middle}
input:disabled{opacity:.5}
select option{background:var(--bg2)}
.params{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.params label{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;display:flex;flex-direction:column;gap:5px}
.params label.chk{flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:12px;font-weight:400;color:var(--text2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;flex-wrap:wrap}
.seg button{border:none;border-radius:0;background:transparent}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--blue);color:#fff}
.radio{display:inline-flex;gap:10px;align-items:center;font-size:12px;color:var(--text2)}
.radio label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
a{color:var(--blue)}
a.lk{font-size:11px;text-decoration:none;margin-right:8px;white-space:nowrap}
a.lk:hover{text-decoration:underline}

/* ---------- tarjetas, KPIs ---------- */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:1.1rem;animation:scaleIn .2s ease both}
.card>.hd{padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.card>.hd .sub{font-weight:400;color:var(--text2);font-size:12px}
.card>.body{padding:0 16px 16px}
details.card>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:8px;font-weight:600}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"›";color:var(--text3);font-size:16px;width:10px;transition:transform .15s}
details.card[open]>summary::before{transform:rotate(90deg)}
details.card>summary .sub{font-weight:400;color:var(--text2);font-size:12px}
.card.aviso{border-color:rgba(245,166,35,.45)}
.card.aviso>.hd{color:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.1rem}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.85rem 1rem;animation:scaleIn .3s ease both}
.kpi .l{font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500}
.kpi .v{font:600 22px var(--mono);line-height:1.15}
.kpi .ks{font-size:10.5px;color:var(--text3);margin-top:3px}
.kpi.ok .v{color:var(--green)} .kpi.warn .v{color:var(--amber)} .kpi.err .v{color:var(--red)} .kpi.info .v{color:var(--blue)}
.bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--blue)}
.bar.ok>i{background:var(--green)}
.empty{padding:2.5rem 16px;text-align:center;color:var(--text3)}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
label.subir{display:block;border:1.5px dashed var(--border);background:var(--bg3);cursor:pointer;border-radius:var(--radius-lg);padding:2rem 1rem;text-align:center;color:var(--text2);transition:border-color .15s}
label.subir:hover,label.subir.drag{border-color:var(--blue);color:var(--text)}
label.subir b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.note{font-size:12px;color:var(--text2);margin:8px 0 0}
.avisos{margin:0;padding:0;list-style:none}
.avisos li{padding:4px 0;font-size:12.5px}
.avisos li.warn{color:var(--amber)} .avisos li.err{color:var(--red)} .avisos li.info{color:var(--text2)}

/* ---------- tablas ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:left;padding:8px 10px;color:var(--text3);font-weight:500;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--bg3);position:sticky;top:0;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg3)}
tbody tr{animation:rowIn .2s ease both}
td.num,th.num{text-align:right} td.num{font-family:var(--mono);white-space:nowrap}
td.c,th.c{text-align:center}
tr.grupo td{background:var(--bg);color:var(--text2);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:6px 10px}
tr.tot td{font-weight:600;background:var(--bg3)}
tr.sel td{background:rgba(240,96,96,.07)}
tr.hecho td{opacity:.55}
td input[type=number]{width:58px;padding:4px 6px;font-size:12px}
td input.ancho{width:74px}
td select{padding:4px 6px;font-size:12px}
.proc{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.proc .t{font:11px var(--mono);color:var(--text2);min-width:34px}
.st{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--green)} .st.warn{background:var(--warn-bg);color:var(--amber)}
.st.err{background:var(--err-bg);color:var(--red)} .st.info{background:var(--info-bg);color:var(--blue)} .st.gris{background:var(--bg3);color:var(--text2)}
.st.desp{background:rgba(192,132,252,.15);color:#c084fc}
.st.mel{background:rgba(214,170,110,.16);color:#d6aa6e}
.chip{display:inline-block;white-space:nowrap;background:var(--bg3);color:var(--text2);border-radius:4px;padding:1px 6px;font:11px var(--mono);margin:1px 3px 1px 0}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--text2)}
.dim{color:var(--text3)}
.ok-t{color:var(--green)} .warn-t{color:var(--amber)} .err-t{color:var(--red)}
.cnt{display:flex;align-items:center;gap:4px}
.pzs{font-size:11px;color:var(--text2);margin-top:2px}
.mod{display:flex;align-items:center;gap:8px}
.thumb{width:46px;height:36px;object-fit:contain;background:#fff;border-radius:5px;flex-shrink:0;cursor:zoom-in;border:1px solid var(--border)}
.toast{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:420px}
.toast div{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--blue);padding:10px 14px;border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.4);animation:scaleIn .2s ease}
.toast div.ok{border-left-color:var(--green)} .toast div.warn{border-left-color:var(--amber)} .toast div.err{border-left-color:var(--red)}
.mh{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mh .m{flex:1;min-width:220px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}

/* ---------- indicador de ruta: Corte ━━━ Doblez ━━━ Estructura ---------- */
.rt{display:inline-flex;align-items:center;white-space:nowrap;font:600 10.5px var(--sans)}
.rt .n{padding:2px 8px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);line-height:1.4}
.rt .n.part{border-color:var(--blue);color:var(--blue);background:var(--info-bg)}
.rt .n.done{border-color:var(--green);color:var(--green);background:var(--ok-bg)}
.rt .n.yo{box-shadow:0 0 0 2px rgba(245,166,35,.55)}
.rt .l{width:38px;height:3px;background:var(--border);position:relative;margin:0 2px;border-radius:2px;overflow:hidden}
.rt .l i{position:absolute;left:0;top:0;bottom:0;background:var(--green)}
.rt .l.off{background:none;border-top:2px dashed var(--text3);height:0;width:26px;overflow:visible}
.rt .fin{color:var(--text3);font-weight:500;font-style:italic}
.rt .x{color:var(--amber);font-weight:500;margin-left:7px;font-size:10.5px}
.tg{padding:3px 8px;font-size:11px;border-radius:12px;background:transparent;color:var(--text3)}
.tg.on{background:var(--info-bg);border-color:var(--blue);color:var(--blue)}

dialog{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg2);color:var(--text);padding:0;width:min(1060px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .hd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600}
dialog .db{padding:14px 16px;overflow:auto;max-height:calc(92vh - 60px)}
.ficha{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.ficha img{width:min(420px,100%);background:#fff;border-radius:8px}
@media (max-width:760px){.topbar{padding:1rem}.content{padding:1rem}.sidebar{display:none}}

/* ---------- impresión ---------- */
#print{display:none}
@media print{
  @page{size:letter landscape;margin:9mm}
  html{color-scheme:light}
  body{display:block;height:auto;overflow:visible;background:#fff;color:#111}
  body>*:not(#print){display:none!important}
  #print{display:block;font:11px/1.35 var(--sans);color:#111}
  #print .pg{page-break-after:always}
  #print .pg:last-child{page-break-after:auto}
  #print .ph{display:flex;align-items:center;gap:12px;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:8px}
  #print .ph img{width:40px;height:40px;object-fit:contain}
  #print .ph h1{font-size:15px;margin:0}
  #print .ph .s{font-size:11px;color:#333}
  #print .ph .r{margin-left:auto;text-align:right;font-size:10px;color:#333}
  #print table{font-size:10.5px;border:1px solid #999}
  #print th{background:#eee;color:#111;border:1px solid #999;position:static;padding:4px 6px;font-size:9.5px}
  #print td{border:1px solid #bbb;padding:4px 6px;color:#111;background:#fff!important}
  #print tr.grupo td{background:#f3f3f3!important;font-weight:600}
  #print tr.tot td{background:#eee!important;font-weight:700}
  #print .pzs{color:#444;font-size:9.5px}
  #print .pf{margin-top:8px;font-size:9.5px;color:#555;display:flex;justify-content:space-between}
  #print .firmas{display:flex;gap:40px;margin-top:22px}
  #print .firmas div{flex:1;border-top:1px solid #333;text-align:center;padding-top:3px;font-size:10px}
}
</style>
</head>
<body>
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-box"><img src="assets/logo-li.png" alt="LI" onerror="this.style.display='none'"></div>
    <div class="logo-txt"><div class="logo-text">Programas de producción</div><div class="logo-sub" id="logoSub">Troqueles</div></div>
  </div>
  <div class="ctsw" id="ctsw"></div>
  <div class="nav-section">
    <div class="nav-label">Planeación</div>
    <div class="nav-item" data-t="carga"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>Cargar programa</span><span class="n" id="nCarga">–</span></div>
    <div class="nav-item" data-t="progs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg><span>Programas</span><span class="n" id="nProgs">0</span></div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Operación</div>
    <div class="nav-item" data-t="hora"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg><span>Hora por hora</span><span class="n" id="nHora">0</span></div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Catálogo</div>
    <div class="nav-item" data-t="piezas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17.5h7M17.5 14v7"/></svg><span>Piezas compartidas</span><span class="n" id="nPiezas">0</span></div>
    <div class="nav-item" data-t="rutas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/><line x1="7.5" y1="12" x2="16.5" y2="12"/><polyline points="13.5 9 16.5 12 13.5 15"/></svg><span>Rutas de pieza</span><span class="n" id="nRutas">0</span></div>
    <div class="nav-item" data-t="modelos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/></svg><span>Modelos fuera / dentro</span><span class="n" id="nFuera">0</span></div>

const NUBE_URL_DEF = "https://script.google.com/macros/s/AKfycbz2FkhVj77SGb93Se7AHrgryIVF01W9flBsvqpB_PxsZWdhGERtzMxCNTmTXGd-b7OqTA/exec";   // Apps Script del Sheet «Programas de producción · Troqueles y Estructura» (se cambia con el botón «Nube»)

async function nubeEnviar() {

/** Trae de la nube todo (al abrir) o solo lo que cambió desde la última vez. Lo pendiente de este navegador manda sobre lo que llega. */
async function nubeTraer(todo) {

    const primera = !NUBE.cargado || todo;

    const res = [];

function desglosePiezas(p, mid) {

/* ============================== PROGRAMAS Y AVANCE ============================== */
const progsCT = (ct = CT) => DB.programas.filter(p => p.ct === ct.id);

/** Pasos de la ruta de una OP en orden (Corte → Doblez → Estructura): los de este CT, los de la misma OP en el otro CT y, si no hay, los del despiece */
function pasosRuta(r, ctId, otros) {
  const fuentes = { ...(otros || {}), [ctId]: r }, d = despieceDe(r), out = [];
  for (const mid of ORDEN) {
    const src = fuentes[MAQ[mid].ct]; let on = false, pz = null;
    if (src && src.proc && src.proc[mid]) { on = !!src.proc[mid].on; pz = src.proc[mid].pz; }
    else if (d) { pz = pzDesp(d, mid); on = pz > 0; }
    if (on) out.push({ mid, pz: pzEf(pz), prog: r.cant * pzEf(pz) });
  }
  return out;
}
/** Corte ━━━ Doblez: gris = pendiente, azul = en proceso (%), verde = completo. «sin doblez» cuando la pieza no pasa a la dobladora. */
function rutaHTML(r, ctId, otros, opt = {}) {
  const ps = pasosRuta(r, ctId, otros), rk = opt.rk;
  if (!ps.length) return '<span class="dim">—</span>';
  const pct = p => rk && p.prog ? Math.min(1, hechas(p.mid, rk) / p.prog) : 0;
  const tieneDob = ps.some(p => p.mid === DOBLEZ);
  let h = '<span class="rt">';
  ps.forEach((p, i) => {
    if (i) h += `<span class="l"><i style="width:${Math.round(pct(ps[i - 1]) * 100)}%"></i></span>`;
    const q = pct(p), cls = q >= 1 ? "done" : q > 0 ? "part" : "";
    const tip = rk ? `${MAQ[p.mid].label}: ${fmt(hechas(p.mid, rk))} de ${fmt(p.prog)} pz` : `${MAQ[p.mid].label}: ${fmt(p.pz)} pz por mueble · ${fmt(p.prog)} pz`;
    h += `<span class="n ${cls} ${opt.yo === p.mid ? "yo" : ""}" title="${esc(tip)}">${esc(MAQ[p.mid].corto)}${q >= 1 ? " ✓" : q > 0 ? " " + Math.round(q * 100) + "%" : ""}</span>`;
    if (p.mid === CORTE && !tieneDob) h += `<span class="l off"></span><span class="fin">sin doblez</span>` + (i < ps.length - 1 ? '<span class="l off"></span>' : "");
  });

  if (c && dd && dd.pz < c.pz) h += `<span class="x" title="Piezas que se cortan y no pasan a la dobladora">${fmt((c.pz - dd.pz) * r.cant)} pz sin doblez</span>`;
  return h + "</span>";
}

/* ============================== HORA POR HORA ============================== */
function parseHora(h) { const m = String(h).trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/i); if (!m) return null; let hh = parseInt(m[1]) % 12; if (/pm/i.test(m[3])) hh += 12; return hh * 60 + parseInt(m[2] || "0"); }
function rangos(turno) {
  let prev = -1;
  return (FRANJAS[turno] || []).map((f, i) => {
    const [a0, b0] = f.replace(/\s*⏸.*$/, "").split("–").map(parseHora); let a = a0, b = b0;
    while (a < prev) a += 1440; while (b <= a) b += 1440; prev = a; return { i, s: a, e: b, comida: f.includes("Comida") };
  });
}
function turnoActual(ct, d = new Date()) { if (ct.turnos.length === 1) return ct.turnos[0]; const h = d.getHours(); return h >= 7 && h < 17 ? ct.turnos[0] : h >= 17 && h < 23 ? ct.turnos[1] : ct.turnos[2]; }

  const rs = rangos(turno), m = d.getHours() * 60 + d.getMinutes();
  for (const mm of [m, m + 1440]) { const r = rs.find(x => mm >= x.s && mm < x.e); if (r) return r.comida ? Math.max(0, r.i - 1) : r.i; }
  return 0;
}
const franjaTxt = (turno, i) => String((FRANJAS[turno] || [])[i] || "").replace(/\s*⏸.*$/, "");
function fechaTrabajo(d = new Date()) { const x = new Date(d); if (x.getHours() < 7) x.setDate(x.getDate() - 1); return isoDe(x); }
/* ---------- días hábiles: sin sábados, domingos, descansos obligatorios de la LFT ni días que agregue Leonardo (PREF.inhabiles) ---------- */
const _fest = {};
function festivosLFT(y) {
  if (_fest[y]) return _fest[y];
  const lunes = (m, n) => { const d = new Date(y, m, 1); let c = 0; while (true) { if (d.getDay() === 1 && ++c === n) return isoDe(d); d.setDate(d.getDate() + 1); } };
  const out = [`${y}-01-01`, lunes(1, 1), lunes(2, 3), `${y}-05-01`, `${y}-09-16`, lunes(10, 3), `${y}-12-25`];   // 1-ene, 1er lun feb, 3er lun mar, 1-may, 16-sep, 3er lun nov, 25-dic
  if ((y - 2024) % 6 === 0) out.push(`${y}-10-01`);                                                          // transmisión del Ejecutivo
  return (_fest[y] = out);
}
const inhabil = iso => { const d = fechaDe(iso), w = d.getDay(); return w === 0 || w === 6 || festivosLFT(d.getFullYear()).includes(iso) || (PREF.inhabiles || []).includes(iso); };

function enlazarSubida() {

function leerInput(inp) { const f = inp.files[0]; inp.value = ""; if (f) f.arrayBuffer().then(b => cargarArchivo(b, f.name)); }

/* ---------- Programas guardados ---------- */
function renderProgs() {
  const el = $("#v-progs"), dias = [...new Set(progsCT().map(p => p.dia))].sort().reverse();
  if (!dias.length) { el.innerHTML = `<div class="card"><div class="empty"><b>Aún no hay programas de ${esc(CT.label)}</b>Carga un previo en «Cargar programa» y guárdalo.</div></div>`; return; }

  for (const d of dias) {
    progsCT().filter(p => p.dia === d).sort((a, b) => b.version - a.version).forEach((p, i) => {
      h += `<tr class="${i ? "hecho" : ""}"><td>${i ? '<span class="dim">↳ versión anterior</span>' : `<b>${fechaLarga(d)}</b>`}</td><td class="mono">${i ? "" : diaCorto(trabajoDe(p))}</td><td>${esc(p.tipo)} v${p.version}<div class="dim" style="font-size:11px">${esc(p.archivo)}</div></td>
        <td class="num">${p.rows.length}</td><td class="num">${fmt(p.rows.reduce((s, r) => s + r.cant, 0))}</td>
        ${CT.maqs.map(m => { const s = stats(p, m.id); return `<td><div class="cnt"><span class="mono">${fmt(s.h)} / ${fmt(s.prog)}</span>${barra(s.pct, s.pct >= 1)}<span class="mono dim">${Math.round(s.pct * 100)}%</span></div></td>`; }).join("")}
        <td class="mono">${horaCorta(p.guardado)}</td>
        <td style="white-space:nowrap"><button class="mini" data-ver="${p.id}">Ver</button> <button class="mini" data-xls="${p.id}">Excel</button> <button class="mini peligro" data-del="${p.id}">Borrar</button></td></tr>`;
    });
  }
  el.innerHTML = h + `</tbody></table></div></div><p class="note">El avance se registra por OP: si llega una versión nueva del programa (previo corregido o lanzado), lo ya registrado se conserva.</p>`;
  el.querySelectorAll("[data-ver]").forEach(b => b.onclick = () => { verId = b.dataset.ver; abrir("ver"); });
  el.querySelectorAll("[data-xls]").forEach(b => b.onclick = () => exportarExcel(DB.programas.find(p => p.id === b.dataset.xls)));
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const p = DB.programas.find(x => x.id === b.dataset.del);
    if (!confirm(`¿Borrar el programa de ${CT.label} del ${fechaCorta(p.dia)} (${p.tipo} v${p.version})? Los registros de hora por hora no se borran.`)) return;
    DB.programas = DB.programas.filter(x => x.id !== p.id); guardar("programas"); renderProgs();
  });
}

/* ---------- Ver un programa ---------- */
function renderVer() {
  const el = $("#v-ver"), p = DB.programas.find(x => x.id === verId && x.ct === CT.id) || progsVigentes().slice(-1)[0];
  if (!p) { el.innerHTML = `<div class="card"><div class="empty"><b>Sin programa</b>Guarda uno desde «Cargar programa».</div></div>`; return; }
  verId = p.id;
  // Troqueles: primero el programa general del CT; de ahí salen, filtrados, el de Láser de cama (el que lee Nidos) y el de la dobladora
  const gen = !uniProc(CT) && (verMaq == null || verMaq === GENERAL), pzs = !uniProc(CT) && verMaq === PIEZAS;
  const m = gen || pzs ? null : CT.maqs.find(x => x.id === verMaq) || CT.maqs[0]; verMaq = gen ? GENERAL : pzs ? PIEZAS : m.id;

  const una = uniProc(CT) || gen || pzs;
  $("#acc").innerHTML = `<button id="bPr1">Imprimir${una ? "" : " " + esc(m.label)}</button>${una ? "" : '<button id="bPr2">Imprimir todas</button>'}<button id="bXls">Exportar Excel</button><button class="pri" id="bIrH">Registrar hora por hora</button>`;
  const idx = indiceOPs();
  let h = uniProc(CT) ? "" : `<div class="toolbar"><div class="seg"><button data-m="${GENERAL}" class="${gen ? "on" : ""}">Programa general · ${fmt(p.rows.length)} OPs</button>${CT.maqs.map(x => { const sx = stats(p, x.id);
      return `<button data-m="${esc(x.id)}" class="${m && x.id === m.id ? "on" : ""}">${esc(x.label)} · ${fmt(sx.ops)} OPs · ${fmt(sx.prog)} pz</button>`; }).join("")}<button data-m="${PIEZAS}" class="${pzs ? "on" : ""}">Desglose de piezas</button></div>
    <span class="dim" style="margin-left:10px;font-size:12px">${gen ? "Todas las OPs que pasan por " + esc(CT.label) + ". Los botones de la derecha filtran el programa de cada máquina." : pzs ? "Piezas de lámina a fabricar: las que comparten varios modelos se suman; las propias van por modelo." : m.id === CORTE ? "Solo las OPs con corte: es el programa que lee Nidos Láser de Cama («Desde Programas»)." : "Solo las OPs que se doblan."}</span></div>`;
  const prevV = progsCT().filter(x => x.dia === p.dia && x.version < p.version).sort((a, b) => b.version - a.version)[0];

    return d.nuevas.length || d.quitadas.length || d.cambio.length ? `<div class="card aviso"><div class="hd">Cambios contra la versión ${prevV.version}</div><div class="body"><ul class="avisos">
      ${d.nuevas.length ? `<li class="warn">Nuevas: ${d.nuevas.map(r => `<span class="chip">${esc(r.op)} ${esc(r.modelo)} ×${r.cant}</span>`).join("")}</li>` : ""}
      ${d.quitadas.length ? `<li class="info">Ya no vienen: ${d.quitadas.map(r => `<span class="chip">${esc(r.op)} ${esc(r.modelo)}</span>`).join("")}</li>` : ""}
      ${d.cambio.length ? `<li class="info">Cantidad: ${d.cambio.map(x => `<span class="chip">${esc(x.r.op)} ${esc(x.r.modelo)} ${x.antes}→${x.r.cant}</span>`).join("")}</li>` : ""}</ul></div></div>` : ""; };
  const retiradas = p.retirados?.length ? `<details class="card"><summary>Retiradas al cargar <span class="sub">${p.retirados.length} OPs no pasan por ${esc(CT.label)}</span></summary><div class="body">${p.retirados.map(r => `<span class="chip">${esc(r.op)} ${esc(r.modelo)} ×${r.cant}</span>`).join("")}</div></details>` : "";

    if ($("#bPr2")) $("#bPr2").onclick = () => imprimir(p, CT.maqs.filter(x => stats(p, x.id).prog > 0));

  };
  if (gen) { el.innerHTML = h + generalHTML(p, idx) + cambios() + retiradas; enlazar(); return; }
  if (pzs) {
    if (!MAQ[verPzMaq] || !CT.maqs.some(x => x.id === verPzMaq)) verPzMaq = CORTE;
    el.innerHTML = h + `<div class="toolbar"><div class="seg">${CT.maqs.map(x => `<button data-pzm="${esc(x.id)}" class="${verPzMaq === x.id ? "on" : ""}">${esc(x.label)}</button>`).join("")}</div>
      <span class="dim" style="margin-left:10px;font-size:12px">Piezas del catálogo de lámina (biblioteca DXF de Nidos y las que captures en «Piezas compartidas»).</span></div>` + desgloseHTML(p, verPzMaq) + cambios();
    enlazar(); enlazarPiezas(el);
    el.querySelectorAll("[data-pzm]").forEach(b => b.onclick = () => { verPzMaq = b.dataset.pzm; renderVer(); });
    return;
  }
  const s = stats(p, m.id), filas = p.rows.filter(r => r.proc?.[m.id]?.on);
  h += `<div class="kpis">${kpi("OPs", fmt(s.ops), fmt(s.mu) + " muebles")}${kpi("Programadas", fmt(s.prog), "piezas", "info")}${kpi(esc(m.hechas), fmt(s.h), Math.round(s.pct * 100) + "% del programa", s.pct >= 1 ? "ok" : "")}
      ${kpi("Faltan", fmt(s.falta), trabajoDe(p) < fechaTrabajo() && s.falta ? "atraso (se debió trabajar el " + fechaCorta(trabajoDe(p)) + ")" : "faltante por procesar", s.falta ? (trabajoDe(p) < fechaTrabajo() ? "err" : "warn") : "ok")}${kpi("Se trabaja", diaCorto(trabajoDe(p)), CT.adelanto + " días hábiles antes del programa")}</div>`;
  h += cambios();
  h += `<div class="card"><div class="tw"><table><thead><tr><th class="num">#</th><th>OP</th><th>Modelo</th><th>Ruta BC</th><th class="num">Muebles</th><th class="num">Pz x mueble</th><th class="num">Programadas</th><th class="num">${esc(m.hechas)}</th><th class="num">Faltan</th><th>Ruta de piezas · avance</th></tr></thead><tbody>`;
  let famAnt = null;

      <td class="mono">${esc(r.ruta || "—")}</td><td class="num">${fmt(r.cant)}</td><td class="num">${r.proc[m.id].pz > 0 ? fmt(r.proc[m.id].pz) : '1 <span class="warn-t" title="Pz por mueble por definir">*</span>'}</td>
      <td class="num"><b>${fmt(pr)}</b></td><td class="num">${fmt(he)}</td><td class="num ${pr - he > 0 ? "" : "ok-t"}">${fmt(Math.max(0, pr - he))}</td>
      <td>${rutaHTML(r, CT.id, otrosDeIdx(idx, rk), { rk, yo: m.id })}</td></tr>`;

    ${!filas.length ? `<div class="empty">Ninguna OP de este programa pasa por ${esc(m.label)}.</div>` : ""}</div>`;
  el.innerHTML = h + retiradas;
  enlazar();
}
const GENERAL = "GENERAL", PIEZAS = "PIEZAS";

/** Programa general del CT (Troqueles): todas las OPs con lo que lleva cada una en cada máquina */
function generalHTML(p, idx) {
  const st = Object.fromEntries(CT.maqs.map(x => [x.id, stats(p, x.id)])), mu = p.rows.reduce((a, r) => a + r.cant, 0);

      ${kpi("Se trabaja", diaCorto(trabajoDe(p)), CT.adelanto + " días hábiles antes del programa")}${sinNada ? kpi("Sin proceso", fmt(sinNada), "OPs sin corte ni doblez marcado", "warn") : ""}</div>`;

  let famAnt = null;
  p.rows.forEach((r, i) => {
    if (r.familia !== famAnt) { h += `<tr class="grupo"><td colspan="${6 + CT.maqs.length}">${esc(r.familia || "Sin familia")}</td></tr>`; famAnt = r.familia; }
    const rk = rkey(p.dia, r.k);
    h += `<tr><td class="num dim">${i + 1}</td><td class="mono">${esc(r.op)}</td><td>${modeloHTML(r)}</td><td class="mono">${esc(r.ruta || "—")}</td><td class="num">${fmt(r.cant)}</td>

/* ---------- Hora por hora ---------- */
function pendientes(mid) {
  const out = [], vistos = new Map();
  for (const p of progsVigentes()) {
    const t = trabajoDe(p);   // el CT trabaja el programa unos días hábiles antes de su fecha (Troqueles 3, Estructura 2)
    if (t > H.fecha && !PREF.siguiente) continue;
    const grupo = t < H.fecha ? "atraso" : t === H.fecha ? "dia" : "sig";
    for (const r of p.rows) {
      const pr = programadas(r, mid); if (!pr) continue;
      const rk = rkey(p.dia, r.k), he = hechas(mid, rk), falta = pr - he;
      if (falta <= 0 && !(H.completas && grupo !== "atraso")) continue;
      const x = { p, r, rk, pr, he, falta: Math.max(0, falta), grupo };
      if (vistos.has(rk)) out[vistos.get(rk)] = x; else { vistos.set(rk, out.length); out.push(x); }   // misma OP en dos días: cuenta el más reciente
    }
  }
  return out;
}

        <td>${rutaPiezaHTML(p)}</td><td><button class="mini peligro dx">✕</button></td></tr>`).join("")}
      </tbody></table></div>
      <div class="toolbar" style="margin-top:10px"><button id="dA1">+ Pieza Corte → Doblez</button><button id="dA2">+ Pieza solo corte (sin doblez)</button><button id="dA3">+ Corte → Doblez → Estructura</button></div>
      <div class="mh">${ORDEN.map(m => `<div class="m" style="min-width:120px"><div class="dim" style="font-size:11px">${esc(MAQ[m].label)}</div><b class="mono">${fmt(pzDesp(D, m))}</b> <span class="dim">pz/mueble</span></div>`).join("")}</div>
      <div class="toolbar"><span class="sp"></span>${d0 ? '<button class="peligro" id="dDel">Borrar despiece</button>' : ""}<button id="dCan">Cancelar</button><button class="pri" id="dOk">Guardar despiece</button></div>`;
    $("#dlgB").innerHTML = h;
    $("#dlgB").querySelectorAll("tr[data-i]").forEach(tr => {
      const p = D.piezas[+tr.dataset.i];
      tr.querySelector(".dn").oninput = e => { p.nombre = e.target.value; };
      tr.querySelector(".dp").onchange = e => { const v = parseFloat(e.target.value); p.pz = v > 0 ? v : 0; pintar(); };
      tr.querySelectorAll(".tg").forEach(b => b.onclick = () => { const m = b.dataset.m; p.ruta = p.ruta.includes(m) ? p.ruta.filter(x => x !== m) : ORDEN.filter(x => x === m || p.ruta.includes(x)); pintar(); });
      tr.querySelector(".dx").onclick = () => { D.piezas.splice(+tr.dataset.i, 1); pintar(); };
    });
    const nueva = r => { D.piezas.push({ id: uid(), nombre: "", pz: 1, ruta: r }); pintar(); setTimeout(() => { const xs = $("#dlgB").querySelectorAll(".dn"); xs[xs.length - 1]?.focus(); }, 30); };
    $("#dA1").onclick = () => nueva([CORTE, DOBLEZ]);
    $("#dA2").onclick = () => nueva([CORTE]);
    $("#dA3").onclick = () => nueva([CORTE, DOBLEZ, CTS[1].maqs[0].id]);
    $("#dCan").onclick = () => $("#dlg").close();
    if ($("#dDel")) $("#dDel").onclick = () => { if (!confirm("¿Borrar el despiece de esta ruta? Los programas ya guardados no cambian.")) return; delete DB.despiece[k]; guardar("despiece"); repreparar(); $("#dlg").close(); abrir(vista); };
    $("#dOk").onclick = () => {
      const piezas = D.piezas.filter(p => (p.nombre || "").trim() || p.ruta.length).map(p => ({ id: p.id || uid(), nombre: (p.nombre || "").trim(), pz: +p.pz || 0, ruta: p.ruta }));
      if (!piezas.length) { toast("Agrega al menos una pieza.", "warn"); return; }
      if (piezas.some(p => !p.nombre)) { toast("Ponle nombre a cada pieza.", "warn"); return; }
      if (piezas.some(p => !(p.pz > 0) || !p.ruta.length)) { toast("Cada pieza necesita piezas por mueble y al menos un proceso.", "warn"); return; }
      const fam = Object.values(DB.modelos).find(x => ruta && up(x.ruta) === up(ruta))?.familia || "";
      DB.despiece[k] = { ruta: ruta || "", modelo: ruta ? "" : modelo, familia: fam, piezas, act: new Date().toISOString() };
      guardar("despiece"); repreparar(); $("#dlg").close();
      toast(`Despiece de ${esc(ruta || modelo)} guardado: ${piezas.length} pieza(s). Se aplica a los borradores y a los siguientes programas.`, "ok");
      abrir(vista);
    };
  };
  pintar(); $("#dlg").showModal();
}

/* ---------- Modelos fuera / dentro ---------- */
function renderModelos() {
  const el = $("#v-modelos"), todos = Object.values(DB.modelos).filter(x => x.ct === CT.id);
  const fuera = todos.filter(x => x.estado === "fuera"), dentro = todos.filter(x => x.estado === "dentro");
  $("#acc").innerHTML = `<button id="mXls">Exportar lista (Excel)</button>`;
  const q = up(busq), pasa = x => !q || [x.valor, x.ruta, x.desc, x.familia].some(v => up(v).includes(q));
  let h = `<div class="toolbar"><div class="seg"><button data-mt="fuera" class="${modTab === "fuera" ? "on" : ""}">No pasan por ${esc(CT.label)} (${fuera.length})</button><button data-mt="dentro" class="${modTab === "dentro" ? "on" : ""}">Pasan por ${esc(CT.label)} (${dentro.length})</button></div>
    <input type="text" id="mBus" placeholder="Buscar modelo, ruta o familia" value="${esc(busq)}" style="width:260px"></div>`;
  if (modTab === "fuera") {
    const xs = fuera.filter(pasa).sort((a, b) => a.valor.localeCompare(b.valor));
    h += `<div class="card"><div class="hd">Agregar a la lista <span class="sub">también puedes marcarlos desde «Cargar programa»</span></div><div class="body"><div class="params">
        <label>Modelo o ruta<input type="text" id="mNuevo" style="width:200px" placeholder="p. ej. FA-6728 o 692"></label>
        <label>Tipo<select id="mTipo"><option value="modelo">Modelo (SKU exacto)</option><option value="ruta">Ruta (todas sus variantes)</option></select></label>
        <button class="peligro" id="mAdd">No pasa por ${esc(CT.label)}</button></div></div></div>
      <div class="card"><div class="tw"><table><thead><tr><th>Tipo</th><th>Modelo / ruta</th><th>Ruta</th><th>Familia</th><th>Desde</th><th>Origen</th><th></th></tr></thead><tbody>
      ${xs.map(x => `<tr><td>${x.tipo === "ruta" ? '<span class="st info">Ruta</span>' : '<span class="st gris">Modelo</span>'}</td><td>${modeloHTML({ modelo: x.valor, ruta: x.ruta, desc: x.desc })}</td>
        <td class="mono">${esc(x.ruta || "—")}</td><td class="muted">${esc(x.familia)}</td><td class="mono">${horaCorta(x.alta)}</td><td class="dim">${esc(x.origen || "")}</td>
        <td><button class="mini ok" data-reg="${esc(x.key)}">Regresar a ${esc(CT.label)}</button></td></tr>`).join("")}</tbody></table></div>
      ${!xs.length ? '<div class="empty">Sin modelos fuera todavía.</div>' : ""}</div>`;
  } else {
    const xs = dentro.filter(pasa).sort((a, b) => a.valor.localeCompare(b.valor));
    h += `<div class="card"><div class="tw"><table><thead><tr><th>Modelo</th><th>Ruta</th><th>Familia</th>${CT.maqs.map(m => `<th>${uniProc(CT) ? "Piezas por mueble" : esc(m.corto) + " · pz/mueble"}</th>`).join("")}<th>Ruta de piezas</th><th>Último programa</th><th></th></tr></thead><tbody>
      ${xs.map(x => { const desp = !!despieceDe({ ruta: x.ruta, modelo: x.valor }); const r = { ...x, modelo: x.valor, cant: 1, proc: x.proc || procVacio(CT) };
        return `<tr data-key="${esc(x.key)}"><td>${modeloHTML({ modelo: x.valor, ruta: x.ruta, desc: x.desc })}</td><td class="mono">${esc(x.ruta || "—")}</td><td class="muted">${esc(x.familia)}</td>
        ${CT.maqs.map(m => { const p = x.proc?.[m.id] || {}; return `<td><span class="proc">${uniProc(CT) ? "" : `<input type="checkbox" class="pc" data-m="${esc(m.id)}" ${p.on ? "checked" : ""}>`}<input type="number" min="0" class="pn" data-m="${esc(m.id)}" value="${p.pz ?? ""}" placeholder="1"></span></td>`; }).join("")}
        <td>${rutaHTML(r, CT.id, {})}${desp ? ' <span class="st desp">despiece</span>' : ""}</td>
        <td class="mono">${x.visto ? fechaCorta(x.visto) : "—"}</td><td><button class="mini peligro" data-fuera="${esc(x.key)}">No pasa</button></td></tr>`; }).join("")}</tbody></table></div>
      ${!xs.length ? '<div class="empty">Se llena solo al guardar programas: cada modelo que queda en el programa se recuerda aquí.</div>' : ""}</div>
      <p class="note">Los cambios aplican a los siguientes programas que cargues (los ya guardados no cambian). Si la ruta tiene despiece, el despiece manda.</p>`;
  }
  el.innerHTML = h;
  el.querySelectorAll("[data-mt]").forEach(b => b.onclick = () => { modTab = b.dataset.mt; renderModelos(); });
  const bus = $("#mBus"); bus.oninput = () => { busq = bus.value; clearTimeout(bus._t); bus._t = setTimeout(() => { renderModelos(); const b = $("#mBus"); b.focus(); b.setSelectionRange(b.value.length, b.value.length); }, 250); };
  $("#mXls").onclick = exportarModelos;
  el.querySelectorAll("[data-reg]").forEach(b => b.onclick = () => { regresarDentro(b.dataset.reg); renderModelos(); });
  el.querySelectorAll("[data-fuera]").forEach(b => b.onclick = () => { const x = DB.modelos[b.dataset.fuera]; x.estado = "fuera"; x.act = new Date().toISOString(); x.origen = "Catálogo"; guardar("modelos"); renderModelos(); });
  if ($("#mAdd")) $("#mAdd").onclick = () => {
    const v = $("#mNuevo").value.trim(), t = $("#mTipo").value; if (!v) return;
    const key = t === "ruta" ? keyR(CT.id, v) : keyM(CT.id, v), now = new Date().toISOString();
    DB.modelos[key] = { key, ct: CT.id, tipo: t, valor: v, estado: "fuera", ruta: t === "ruta" ? v : (DB.equiv[up(v)] || EQUIV_SEED[up(v)] || ""), desc: "", familia: "", alta: now, act: now, origen: "Captura manual" };
    guardar("modelos"); toast(`${esc(v)} queda fuera de ${esc(CT.label)}.`, "ok"); renderModelos();
  };
  el.querySelectorAll("tr[data-key]").forEach(tr => {
    const x = DB.modelos[tr.dataset.key]; x.proc = x.proc || procVacio(CT);
    tr.querySelectorAll(".pc").forEach(cb => cb.onchange = () => { (x.proc[cb.dataset.m] = x.proc[cb.dataset.m] || {}).on = cb.checked; x.act = new Date().toISOString(); guardar("modelos"); renderModelos(); });
    tr.querySelectorAll(".pn").forEach(inp => inp.onchange = () => { const v = parseFloat(inp.value); const pp = (x.proc[inp.dataset.m] = x.proc[inp.dataset.m] || {}); pp.pz = v > 0 ? v : null; if (uniProc(CT)) pp.on = true; x.act = new Date().toISOString(); guardar("modelos"); renderModelos(); });
  });
}

/* ============================== EXPORTAR / IMPRIMIR / RESPALDO ============================== */
/** Troqueles: 1ª hoja «Ordenes» (formato de BC que lee Nidos) y hojas por máquina con «Observaciones» (formato del programa del día de la OEE) */
function exportarExcel(p) {
  if (!p) return;
  const ct = ctDe(p.ct), wb = XLSX.utils.book_new(), idx = indiceOPs();
  if (ct.id === "TROQUELES") {
    const ord = [["Nº", "Cód. procedencia mov.", "Cantidad", "Descripción", "Nº ruta", "Fecha-hora inicial", "Familia"]];
    p.rows.filter(r => r.proc?.[CORTE]?.on).forEach(r => ord.push([r.op, r.modelo, r.cant, r.desc || "", r.ruta || "", r.ini ? new Date(r.ini) : "", r.familia || ""]));
    const w1 = XLSX.utils.aoa_to_sheet(ord, { cellDates: true }); w1["!cols"] = [{ wch: 13 }, { wch: 22 }, { wch: 9 }, { wch: 40 }, { wch: 14 }, { wch: 18 }, { wch: 14 }];
    XLSX.utils.book_append_sheet(wb, w1, "Ordenes");
  }
  for (const m of ct.maqs) {
    const filas = p.rows.filter(r => r.proc?.[m.id]?.on); if (!filas.length) continue;
    const aoa = [[`F-PROGRAMA DE PRODUCCIÓN ${ct.label.toUpperCase()}${uniProc(ct) ? "" : " · " + m.label.toUpperCase()}`], [fechaLarga(p.dia).toUpperCase() + ` · ${p.tipo} v${p.version} · SE TRABAJA EL ${fechaLarga(trabajoDe(p)).toUpperCase()}`], [],
                 ["#", "Modelo", "OP", "Cant.", "Familia", "Ruta", "Pz x mueble", "Cant. progra.", "Ruta de piezas", "Piezas", "Observaciones"]];
    filas.forEach((r, i) => aoa.push([i + 1, r.modelo, r.op, r.cant, r.familia || "", r.ruta || "", pzEf(r.proc[m.id].pz), programadas(r, m.id), rutaTexto(r, ct.id, otrosDeIdx(idx, rkey(p.dia, r.k))), piezasTxt(r, m.id), ""]));
    const ws = XLSX.utils.aoa_to_sheet(aoa); ws["!cols"] = [{ wch: 5 }, { wch: 20 }, { wch: 13 }, { wch: 7 }, { wch: 12 }, { wch: 12 }, { wch: 11 }, { wch: 13 }, { wch: 30 }, { wch: 36 }, { wch: 30 }];
    XLSX.utils.book_append_sheet(wb, ws, m.id.slice(0, 31));
  }
  if (ct.id === "TROQUELES") {     // desglose de piezas de lámina: compartidas sumadas, propias por modelo
    if (stats(p, CORTE).ops) XLSX.utils.book_append_sheet(wb, hojaDesglose(p, CORTE), "Piezas Laser de Cama");
    if (stats(p, DOBLEZ).ops) XLSX.utils.book_append_sheet(wb, hojaDesglose(p, DOBLEZ), "Piezas Dobladora");
  }
  const ret = [["OP", "Modelo", "Cant.", "Ruta", "Fuera por"], ...(p.retirados || []).map(r => [r.op, r.modelo, r.cant, r.ruta, r.por])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ret), "Retiradas");
  const nombre = `${p.dia}-programa-${ct.slug}.xlsx`;
  XLSX.writeFile(wb, nombre);
  toast(`Exportado <b>${esc(nombre)}</b>${ct.id === "TROQUELES" ? ": la hoja «Ordenes» sirve para Nidos y «Laser de Cama» para la OEE" : ""}.`, "ok");
}
function exportarModelos() {
  const wb = XLSX.utils.book_new(), xs = Object.values(DB.modelos).filter(x => x.ct === CT.id).sort((a, b) => a.estado.localeCompare(b.estado) || a.valor.localeCompare(b.valor));
  const aoa = [["Estado", "Tipo", "Modelo / ruta", "Ruta", "Familia", "Descripción", ...CT.maqs.flatMap(m => [m.label, "Pz x mueble"]), "Alta", "Origen"],
    ...xs.map(x => [x.estado === "fuera" ? `No pasa por ${CT.label}` : `Pasa por ${CT.label}`, x.tipo, x.valor, x.ruta || "", x.familia || "", x.desc || "",
      ...CT.maqs.flatMap(m => x.estado === "dentro" ? [x.proc?.[m.id]?.on ? "Sí" : "No", x.proc?.[m.id]?.pz ?? ""] : ["", ""]), (x.alta || "").slice(0, 10), x.origen || ""])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "Modelos");
  const desp = [["Ruta", "Modelo", "Pieza", "Pz x mueble", ...ORDEN.map(m => MAQ[m].label), "Ruta de la pieza"]];
  for (const [, d] of despModelos()) for (const p of d.piezas) desp.push([d.ruta, d.modelo || "", p.nombre, p.pz, ...ORDEN.map(m => p.ruta.includes(m) ? "Sí" : ""), ORDEN.filter(m => p.ruta.includes(m)).map(m => MAQ[m].corto).join(" → ")]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(desp), "Despiece");
  XLSX.writeFile(wb, `${hoyISO()}-modelos-${CT.slug}.xlsx`);
}
function imprimir(p, maqs) {
  const ct = ctDe(p.ct), logo = new URL("assets/logo-li.png", location.href).href, idx = indiceOPs();
  $("#print").innerHTML = maqs.map(m => {
    const filas = p.rows.filter(r => r.proc?.[m.id]?.on); let fam = null, tot = 0, mu = 0;
    const cuerpo = filas.map((r, i) => {
      const pr = programadas(r, m.id); tot += pr; mu += r.cant;
      const g = r.familia !== fam ? `<tr class="grupo"><td colspan="11">${esc(r.familia || "Sin familia")}</td></tr>` : ""; fam = r.familia;
      const pt = piezasTxt(r, m.id);
      return g + `<tr><td>${i + 1}</td><td>${esc(r.op)}</td><td><b>${esc(r.modelo)}</b>${pt ? `<div class="pzs">${esc(pt)}</div>` : ""}</td><td>${esc(r.ruta || "")}</td><td style="text-align:right">${r.cant}</td><td style="text-align:right">${pzEf(r.proc[m.id].pz)}</td><td style="text-align:right"><b>${pr}</b></td>
        <td>${esc(rutaTexto(r, ct.id, otrosDeIdx(idx, rkey(p.dia, r.k))))}</td><td style="width:62px"></td><td style="width:62px"></td><td style="width:150px"></td></tr>`;
    }).join("");
    return `<div class="pg"><div class="ph"><img src="${logo}" alt=""><div><h1>Programa de producción · ${esc(ct.label)}${uniProc(ct) ? "" : " · " + esc(m.label)}</h1><div class="s">Programa del ${fechaLarga(p.dia)} · se trabaja el <b>${fechaLarga(trabajoDe(p))}</b></div></div>
      <div class="r">${esc(p.tipo)} v${p.version} · ${esc(p.archivo)}<br>Impreso ${horaCorta(new Date().toISOString())}</div></div>
      <table><thead><tr><th>#</th><th>OP</th><th>Modelo / piezas</th><th>Ruta BC</th><th>Muebles</th><th>Pz x mueble</th><th>Pz progra.</th><th>Ruta de piezas</th><th>${esc(m.hechas)}</th><th>Dañadas</th><th>Observaciones</th></tr></thead>
      <tbody>${cuerpo}<tr class="tot"><td colspan="4">Total · ${filas.length} OPs</td><td style="text-align:right">${mu}</td><td></td><td style="text-align:right">${tot}</td><td></td><td></td><td></td><td></td></tr></tbody></table>
      <div class="firmas"><div>Elaboró</div><div>Líder de ${esc(ct.label)}</div><div>Operador</div></div>
      <div class="pf"><span>Línea Italia · Ingeniería de Procesos</span><span>Programas de producción</span></div></div>`;
  }).join("");
  setTimeout(() => window.print(), 150);
}
$("#bResp").onclick = () => {
  const data = { app: "programa-troqueles", version: VERSION, fecha: new Date().toISOString(), modelos: DB.modelos, despiece: DB.despiece, equiv: DB.equiv, bcRutas: DB.bcRutas, programas: DB.programas, registros: DB.registros };
  descargar(`${hoyISO()}-respaldo-programas-produccion.json`, JSON.stringify(data), "application/json");
};
$("#fResp").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); if (d.app !== "programa-troqueles") throw new Error("No es un respaldo de esta herramienta");
    if (!confirm(`Restaurar el respaldo del ${horaCorta(d.fecha)}: ${Object.keys(d.modelos || {}).length} modelos, ${Object.keys(d.despiece || {}).length} despieces, ${(d.programas || []).length} programas y ${(d.registros || []).length} registros. Reemplaza lo que hay en este navegador. ¿Continuar?`)) return;
    DB.modelos = d.modelos || {}; DB.despiece = d.despiece || {}; DB.equiv = d.equiv || {}; DB.bcRutas = d.bcRutas || {}; DB.programas = d.programas || []; DB.registros = d.registros || [];
    migrar(); guardar("modelos", "despiece", "equiv", "bcRutas", "programas", "registros"); toast("Respaldo restaurado.", "ok"); abrir(vista);
  } catch (err) { toast(esc(err.message), "err"); }
};

/* ============================== ARRANQUE ============================== */
document.querySelectorAll(".nav-item[data-t]").forEach(n => n.onclick = () => abrir(n.dataset.t));
$("#bMenu").onclick = () => { const c = $("#sidebar").classList.toggle("collapsed"); PREF.menu = c ? "1" : "0"; guardar("pref"); };
$("#dlgX").onclick = () => $("#dlg").close();
if (PREF.menu === "1") $("#sidebar").classList.add("collapsed");
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer?.files?.[0]; if (f && /\.xlsx?$/i.test(f.name)) f.arrayBuffer().then(b => cargarArchivo(b, f.name)); });
pintarCTs();
LISTO = true;
abrir(bor() ? "carga" : (progsVigentes().length ? "hora" : "carga"));
// nube: al abrir trae todo; luego cada minuto, al volver a la pestaña y al recuperar internet
$("#bNube").onclick = abrirNube;
pintarNube();
if (NUBE.url) nubeTraer(true);
setInterval(() => { if (NUBE.url && !document.hidden) nubeTraer(false); }, 60000);
document.addEventListener("visibilitychange", () => { if (NUBE.url && !document.hidden) nubeTraer(false); });
window.addEventListener("online", () => { if (NUBE.url) nubeTraer(false); });
window.PT = { cargarArchivo, DB, cambiarCT, abrirDespiece, ingDe, guardarTodos, NUBE, PREF, guardar, nubeTraer, nubeEnviar, CTS, VERSION,
  get B() { return bor(); }, get BS() { return BS; }, get CT() { return CT; },
  /** Rutina del agente: abre un previo o exporte servido por el mismo servidor (herramientas/servir.ps1 → /previo/<archivo>) */
  async cargarUrl(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error(`No se pudo leer ${u} (${r.status})`); cargarArchivo(await r.arrayBuffer(), decodeURIComponent(u.split("/").pop())); },
  /** Lo que se guardaría por CT: OPs incluidas, retiradas y modelos nuevos (sin marcar fuera/dentro) */
  resumen() { return CTS.map(c => { const b = bor(c); if (!b) return { ct: c.id, sinBorrador: true }; const fs = filasB(c), inc = fs.filter(x => !x.c.fuera);
    return { ct: c.id, archivo: b.archivo, dia: b.dia, trabajo: restarHabiles(b.dia, c.adelanto || 0), ops: fs.length, incluidas: inc.length, retiradas: fs.length - inc.length,
             piezas: inc.reduce((a, x) => a + Object.values(x.f.proc || {}).reduce((s, p) => s + (p.on && p.pz ? p.pz * x.f.cant : 0), 0), 0),
             nuevos: [...new Set(inc.filter(x => x.c.nuevo).map(x => x.f.modelo))],
             sinPiezas: c.id === "TROQUELES" ? [...new Set(inc.filter(x => x.f.proc?.[CORTE]?.on && !piezasCat(x.f).length).map(x => x.f.ruta || x.f.modelo))] : [] }; }); },
  /** Programas ya guardados de un día (todas las versiones) */
  guardados(dia) { return DB.programas.filter(p => p.dia === dia).map(p => ({ ct: p.ct, version: p.version, ops: p.rows.length, guardado: p.guardado })); },
  /** Modelos (ruta) del programa vigente de Troqueles de ese día que aún no tienen piezas en el catálogo: lo que falta capturar */
  sinPiezas(dia) { const p = vigente(dia, ctDe("TROQUELES")); return p ? [...new Set(p.rows.filter(r => r.proc?.[CORTE]?.on && !piezasCat(r).length).map(r => r.ruta || r.modelo))] : []; } };   // para pruebas y para la rutina
</script>
